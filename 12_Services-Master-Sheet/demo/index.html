    ${fld('<span id="lblFee">Ticket amount (₹)</span>', inp('ticketAmount', b.ticketAmount, 'type="number" min="0"'))}
    ${fld('Service charge (₹)', inp('serviceCharge', b.serviceCharge, 'type="number" min="0"'))}
    ${fld('Amount received (₹)', inp('received', b.received, 'type="number" min="0"'))}
    ${fld('Payment mode', sel('paymentMode', S.db.lists.paymentModes, b.paymentMode, '—'))}
    <div class="spanAll row" style="justify-content:flex-end;font-size:15px">Total: <b id="bkTotal" style="margin-left:6px">₹0</b></div>
    ${fld('Remarks', `<textarea class="i" name="remarks" rows="2">${esc(b.remarks)}</textarea>`, 'spanAll')}
  </form>`, foot: `<button class="btn" data-x2>Cancel</button><button class="btn primary" data-ok>${id ? 'Save changes' : 'Create booking'}</button>`, noFocus: true });
  const f = $('#fBk', m.el);
  const maxP = () => { const s = serviceByName(f.service.value); return num(s && s.maxPersons) || 6; };
  const recalc = (force) => {
    const s = serviceByName(f.service.value);
    if (s && force) {
      const n = num(f.persons.value) || 1;
      const per = String(s.per || 'Person').toLowerCase();
      const units = per === 'person' ? n : per === 'couple' ? Math.ceil(n / 2) : 1;
      f.ticketAmount.value = num(s.price) * units;
      f.serviceCharge.value = s.serviceCharge !== '' && s.serviceCharge != null ? num(s.serviceCharge) * (per === 'person' ? n : 1) : num(S.db.settings.defaultServiceCharge);
    }
    $('#bkTotal', m.el).textContent = inr(num(f.ticketAmount.value) + num(f.serviceCharge.value));
  };
  const showDocs = () => {
    const s = serviceByName(f.service.value);
    const have = new Set(String(f.documents.value).split(',').map(x => x.trim()).filter(Boolean));
    const need = String((s && s.documents) || '').split(',').map(x => x.trim()).filter(Boolean);
    [...have].forEach(x => { if (!need.includes(x)) need.push(x); });
    $('#bkDocs', m.el).innerHTML = need.length ? need.map(x => `<label class="chip ${have.has(x) ? 'on' : ''}"><input type="checkbox" data-doc="${esc(x)}" ${have.has(x) ? 'checked' : ''} style="display:none">${have.has(x) ? '✔' : '○'} ${esc(x)}</label>`).join('') : '<span class="muted small">No checklist for this service. Add one in Services &amp; Prices.</span>';
    $$('#bkDocs [data-doc]', m.el).forEach(cb => cb.onchange = () => { f.documents.value = $$('#bkDocs [data-doc]', m.el).filter(x => x.checked).map(x => x.dataset.doc).join(', '); showDocs(); });
  };
  const applyDept = (refill) => {
    const kind = DI(f.department.value).kind;
    $$('.dk', f).forEach(el => el.classList.toggle('hide', !el.classList.contains('dk-' + kind)));
    $('#bkWho', m.el).textContent = kind === 'ttd' ? '👨‍👩‍👧 Devotees' : kind === 'travel' ? '👨‍👩‍👧 Passengers' : '👤 Customer / family';
    $('#lblPeople', m.el).textContent = kind === 'ttd' ? 'Devotees' : kind === 'travel' ? 'Passengers' : 'Persons (names)';
    $('#lblFee', m.el).textContent = kind === 'ttd' || kind === 'travel' ? 'Ticket amount (₹)' : 'Govt / portal fee (₹)';
    if (refill) f.service.innerHTML = opt(svcOpts(f.category.value), refill === 'keep' ? b.service : '', '— choose —');
    showDocs();
    const tv = TRAVEL[f.department.value];
    $('#lblPref', m.el).textContent = kind === 'travel' ? 'Journey date (wanted)' : 'Preferred date';
    if (tv) {
      $('#dlOps', m.el).innerHTML = tv.ops.map(o => `<option value="${esc(o)}">`).join('');
      $('#dlCls', m.el).innerHTML = tv.classes.map(o => `<option value="${esc(o)}">`).join('');
      $('#lblVno', m.el).textContent = tv.no;
      if (f.department.value === 'Train' && !f.operator.value) f.operator.value = 'IRCTC';
      f.quota.closest('.f').classList.toggle('hide', f.department.value !== 'Train');
    }
  };
  const autoRelease = () => {
    if (DI(f.department.value).kind !== 'ttd') return;
    if (f.releaseDate.value && id) return;
    const r = upcomingReleases(f.category.value)[0];
    if (r) f.releaseDate.value = r.releaseDate;
  };
  const syncPicked = () => {
    const members = S.db.customers.filter(c => picked.has(c.customerId));
    const order = [...picked].map(cid => members.find(c => c.customerId === cid)).filter(Boolean);
    f.customerIds.value = order.map(c => c.customerId).join(', ');
    if (order.length) {
      f.devotees.value = order.map(c => c.name).join(', ');
      f.persons.value = order.length;
      f.customerName.value = order[0].name;
      const prof = P.find(p => p.name === curProfile);
      f.mobile.value = (prof && prof.contact.mobile) || order[0].mobile || f.mobile.value;
      if (!id) { const last = S.db.bookings.filter(x => x.mobile && x.mobile === f.mobile.value && x.contactVia).pop(); if (last) f.contactVia.value = last.contactVia; }
      f.profile.value = curProfile;
      if (DI(f.department.value).kind === 'travel' && (!f.passengerDetails.value || f.passengerDetails.dataset.auto === '1')) {
        f.passengerDetails.value = order.map(c => [c.name, String(c.gender || '').charAt(0), ageOf(c.dob) || ''].filter(Boolean).join(', ')).join('\n');
        f.passengerDetails.dataset.auto = '1';
      }
    }
    $('#bkPickInfo', m.el).innerHTML = order.length ? `${order.length} selected (max ${maxP()} for this service). Order = order of ticking.` : 'Pick a family above, then tick devotees. Or just type the name and mobile below for a walk-in.';
    if (order.length > maxP()) $('#bkPickInfo', m.el).innerHTML += ' <b style="color:var(--red)">More than allowed for this service.</b>';
    recalc(true);
  };
  const showMembers = () => {
    const prof = P.find(p => p.name === curProfile);
    $('#bkMembers', m.el).innerHTML = prof ? prof.members.map(c => `<div class="pick ${picked.has(c.customerId) ? 'on' : ''}" data-cid="${esc(c.customerId)}"><input type="checkbox" ${picked.has(c.customerId) ? 'checked' : ''}><div class="grow"><b>${esc(c.name)}</b><div class="muted small">${esc(c.gender || '')} · ${ageOf(c.dob) || '?'} yrs · ${maskId(c.idNumber)}</div></div></div>`).join('') : '';
    $$('#bkMembers .pick', m.el).forEach(el => el.onclick = e => {
      const cid = el.dataset.cid;
      if (picked.has(cid)) picked.delete(cid); else picked.add(cid);
      showMembers(); syncPicked();
      e.preventDefault();
    });
  };
  const find = q => {
    q = q.toLowerCase().trim();
    const res = !q ? [] : P.filter(p => p.name.toLowerCase().includes(q) || p.members.some(c => String(c.name).toLowerCase().includes(q) || String(c.mobile).includes(q))).slice(0, 8);
    $('#bkFound', m.el).innerHTML = res.map(p => `<span class="chip ${p.name === curProfile ? 'on' : ''}" data-p="${esc(p.name)}">👨‍👩‍👧 ${esc(p.name)} <span class="n">${p.members.length}</span></span>`).join('') || (q ? '<span class="muted small">No match. Use ＋ New devotee.</span>' : '');
    $$('#bkFound .chip', m.el).forEach(ch => ch.onclick = () => {
      if (curProfile !== ch.dataset.p) picked.clear();
      curProfile = ch.dataset.p;
      const prof = P.find(p => p.name === curProfile);
      prof.members.slice(0, maxP()).forEach(c => picked.add(c.customerId));
      find($('#bkFind', m.el).value); showMembers(); syncPicked();
    });
  };
  $('#bkFind', m.el).addEventListener('input', e => find(e.target.value));
  $('#bkNewCust', m.el).onclick = () => customerForm(null, { profile: curProfile }, saved => {
    P.splice(0, P.length, ...profiles());
    curProfile = saved.profile || saved.name; picked.add(saved.customerId);
    $('#bkFind', m.el).value = curProfile; find(curProfile); showMembers(); syncPicked();
  });
  applyDept('keep');
  f.department.addEventListener('change', () => { applyDept(true); autoRelease(); recalc(true); });
  f.category.addEventListener('change', () => { f.service.innerHTML = opt(svcOpts(f.category.value), '', '— choose —'); autoRelease(); recalc(true); });
  f.service.addEventListener('change', () => {
    recalc(true); showDocs();
    const s = serviceByName(f.service.value);
    if (DI(f.department.value).kind === 'app' && !id && s && num(s.daysToComplete)) f.expectedDate.value = iso(new Date(Date.now() + num(s.daysToComplete) * 86400000));
  });
  f.persons.addEventListener('input', () => recalc(true));
  f.ticketAmount.addEventListener('input', () => recalc(false));
  f.serviceCharge.addEventListener('input', () => recalc(false));
  if (curProfile) { $('#bkFind', m.el).value = curProfile; find(curProfile); showMembers(); if (!id) { const prof = P.find(p => p.name === curProfile); if (prof && !picked.size) prof.members.slice(0, 6).forEach(c => picked.add(c.customerId)); showMembers(); syncPicked(); } }
  else syncPicked();
  if (!id) autoRelease();
  recalc(false);
  if (id) $('#bkPickInfo', m.el).textContent = '';
  m.el.querySelector('[data-x2]').onclick = m.close;
  m.el.querySelector('[data-ok]').onclick = async () => {
    if (!f.reportValidity()) return;
    const d = formData(f);
    if (id) d.bookingId = id;
    if (DI(d.department).kind !== 'ttd') { d.category = d.department; d.ttdLogin = ''; d.releaseDate = ''; }
    if (DI(d.department).kind !== 'app') { delete d.ttdRef; delete d.expectedDate; delete d.documents; }
    try {
      const saved = await saveBooking(d, id ? 'Booking updated' : 'Booking created 🎫');
      m.close();
      openBooking(saved.bookingId, { scrollMsg: !id });
    } catch (e) { fail(e); }
  };
  setTimeout(() => $('#bkFind', m.el).focus(), 30);
}

// ---------------------------------------------------------------- release day board
PAGES.board = () => {
  const cat = S.boardCat;
  const recent = iso(new Date(Date.now() - 3 * 86400000));
  const inCat = b => DI(b).kind === 'ttd' && (!cat || b.category === cat);
  const cols = [
    ['Requested', '📝 Requested', S.db.bookings.filter(b => inCat(b) && b.status === 'Requested')],
    ['Attempting', '⚡ Attempting now', S.db.bookings.filter(b => inCat(b) && b.status === 'Attempting')],
    ['Booked', '✅ Booked (last 3 days)', S.db.bookings.filter(b => inCat(b) && BOOKED.includes(b.status) && String(b.updatedOn).slice(0, 10) >= recent)],
    ['Not Booked', '❌ Not booked (last 3 days)', S.db.bookings.filter(b => inCat(b) && FAILED.includes(b.status) && String(b.updatedOn).slice(0, 10) >= recent)]
  ];
  const rel = upcomingReleases(cat || undefined)[0];
  const card = b => `<div class="kcard" draggable="true" data-drag="${esc(b.bookingId)}">
    <div class="row between"><b style="cursor:pointer" data-act="openBooking" data-id="${esc(b.bookingId)}">${esc(b.customerName)}</b><span class="muted small">${num(b.persons)} 👤</span></div>
    <div class="small muted">${CAT_ICON[b.category] || ''} ${esc(b.service)}</div>
    <div class="small">📅 ${fD(b.preferredDate) || 'Any date'}${b.alternateDate ? ' / ' + fD(b.alternateDate) : ''}</div>
    ${b.ttdLogin ? `<div class="small muted">🔑 ${esc(b.ttdLogin)}</div>` : ''}${b.ttdRef ? `<div class="small"><b>${esc(b.ttdRef)}</b></div>` : ''}
    <div class="row">${b.status === 'Requested' ? `<button class="btn sm" data-act="markAttempt" data-id="${esc(b.bookingId)}">▶ Start</button>` : ''}
    ${b.status === 'Requested' || b.status === 'Attempting' ? `<button class="btn sm green" data-act="markBooked" data-id="${esc(b.bookingId)}">✅</button><button class="btn sm red" data-act="markNotBooked" data-id="${esc(b.bookingId)}">❌</button>` : `<button class="btn sm" data-act="openBooking" data-id="${esc(b.bookingId)}">💬 Message</button>`}</div></div>`;
  return `
  <div class="card" style="margin-bottom:14px"><div class="row wrap between">
    <div><b>Release day mode</b><div class="muted small">Work through the queue on quota day. Drag cards between columns, or use the buttons. Each result opens the Telugu message ready to send.</div></div>
    ${rel ? `<div class="right"><div class="small muted">${esc(rel.label)}</div><div class="cd" style="font-size:22px" data-t="${rel.t}"></div></div>` : ''}
  </div></div>
  <div class="chipsRow"><span class="chip ${!cat ? 'on' : ''}" data-act="boardCat" data-cat="">All</span>${S.db.lists.categories.map(c => `<span class="chip ${cat === c ? 'on' : ''}" data-act="boardCat" data-cat="${esc(c)}">${CAT_ICON[c] || ''} ${esc(c)} <span class="n">${S.db.bookings.filter(b => b.category === c && (b.status === 'Requested' || b.status === 'Attempting')).length}</span></span>`).join('')}</div>
  <div class="kanban">${cols.map(c => `<div class="kcol" data-drop="${c[0]}"><h4>${c[1]} <span class="muted">${c[2].length}</span></h4>${c[2].sort((a, b) => String(a.preferredDate || '9').localeCompare(String(b.preferredDate || '9'))).map(card).join('') || '<div class="muted small" style="padding:10px">Empty</div>'}</div>`).join('')}</div>`;
};
AFTER.board = () => {
  $$('[data-drag]').forEach(el => el.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', el.dataset.drag)));
  $$('[data-drop]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      const to = col.dataset.drop;
      if (to === 'Booked') markBooked(id); else if (to === 'Not Booked') markNotBooked(id); else if (to === 'Attempting') markAttempt(id);
      else saveBooking({ bookingId: id, status: 'Requested' }, 'Moved back to Requested').catch(fail);
    });
  });
};

  if (!S.prof || !P.some(p => p.name === S.prof)) S.prof = shown[0] ? shown[0].name : null;

      <div class="tableWrap"><table class="t"><thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Photo ID</th><th class="hideM">Gotram</th><th class="hideM">ID</th><th></th></tr></thead><tbody>
      ${prof.members.map(c => `<tr class="click" data-act="openCustomer" data-id="${esc(c.customerId)}"><td><b>${esc(c.name)}</b><div class="muted small">${esc(c.dob)}</div></td><td>${ageOf(c.dob)}</td><td>${esc(c.gender)}</td><td>${esc(c.idType)}<div class="small">${esc(S.showIds ? c.idNumber : maskId(c.idNumber))}</div></td><td class="hideM">${esc(c.gotram) || '—'}</td><td class="hideM muted small">${esc(c.customerId)}</td><td class="right"><button class="iconBtn" data-act="editCustomer" data-id="${esc(c.customerId)}" title="Edit">✏️</button></td></tr>`).join('')}

    ${fld('Gotram (for Homam)', inp('gotram', c.gotram))}

    ${fld('Photo ID number', inp('idNumber', c.idNumber), 'span2')}
    <div class="spanAll muted small" style="margin-top:4px">Family address &amp; contact (same for the whole family)</div>
    ${fld('Mobile', inp('mobile', c.mobile, 'inputmode="numeric"'))}
    ${fld('Email ID', inp('email', c.email, 'type="email"'), 'span2')}
    ${fld('Address', inp('address', c.address), 'spanAll')}
    ${fld('City / Town', inp('city', c.city))}${fld('District', inp('district', c.district))}${fld('State', sel('state', L.states, c.state))}
    ${fld('Pincode', inp('pincode', c.pincode, 'inputmode="numeric"'))}${fld('Country', inp('country', c.country))}${fld('Notes', inp('notes', c.notes))}
  </form>`, foot: `${cid && S.user.role === 'Admin' ? '<button class="btn red" data-del style="margin-right:auto">🗑 Delete</button>' : ''}<button class="btn" data-x2>Cancel</button><button class="btn primary" data-ok>Save devotee</button>` });
  m.el.querySelector('[data-x2]').onclick = m.close;

// Excel import / export (template format) ----------------------------------
const TPL_HEAD = ['Profile Name', 'Devotee Name (as on ID)', 'Date of Birth (DD/MM/YYYY)', 'Gender', 'Photo ID Type', 'Photo ID Number', 'Gotram (for Homam)', 'Mobile', 'Email ID', 'Address', 'City / Town', 'District', 'State', 'Pincode', 'Country'];
const TPL_KEYS = ['profile', 'name', 'dob', 'gender', 'idType', 'idNumber', 'gotram', 'mobile', 'email', 'address', 'city', 'district', 'state', 'pincode', 'country'];
const HEAD_ALIASES = { profile: ['profile', 'profilename', 'group', 'family'], name: ['devoteename', 'name', 'fullname', 'pilgrimname', 'devotee'], dob: ['dateofbirth', 'dob', 'birthdate'], gender: ['gender', 'sex'], idType: ['photoidtype', 'idtype', 'idproof'], idNumber: ['photoidnumber', 'idnumber', 'aadhaar', 'aadhaarnumber', 'aadharnumber'], gotram: ['gotram', 'gothram', 'gotra'], mobile: ['mobile', 'mobilenumber', 'phone'], email: ['email', 'emailid', 'mailid'], address: ['address'], city: ['city', 'citytown', 'town', 'village'], district: ['district'], state: ['state'], pincode: ['pincode', 'pin'], country: ['country'] };
const normH = h => String(h == null ? '' : h).replace(/\(.*?\)/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function serialToDmy(n) { const d = new Date(Math.round((n - 25569) * 86400000)); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
function parseTemplate(wb) {
  for (const name of [...wb.SheetNames].sort((a, b) => (/devotee/i.test(b) ? 1 : 0) - (/devotee/i.test(a) ? 1 : 0))) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    for (let h = 0; h < Math.min(10, rows.length); h++) {
      const cols = rows[h].map(x => Object.keys(HEAD_ALIASES).find(k => HEAD_ALIASES[k].includes(normH(x))) || null);
      if (!cols.includes('name')) continue;
      const out = [];
      let last = null;
      for (const row of rows.slice(h + 1)) {
        const r = {};
        cols.forEach((k, i) => { if (k && r[k] === undefined) r[k] = row[i]; });
        if (!Object.values(r).some(v => String(v).trim())) continue;
        if (/^example/i.test(String(r.profile || ''))) { last = 'EXAMPLE'; continue; }
        if (!String(r.profile || '').trim() && last === 'EXAMPLE') continue;
        Object.keys(r).forEach(k => { r[k] = typeof r[k] === 'number' && k !== 'dob' ? (Number.isInteger(r[k]) ? r[k].toFixed(0) : String(r[k])) : String(r[k]).trim(); });
        if (typeof row[cols.indexOf('dob')] === 'number') r.dob = serialToDmy(row[cols.indexOf('dob')]);
        else if (/^\d{4}-\d{2}-\d{2}/.test(r.dob)) { const [y, mo, d] = r.dob.slice(0, 10).split('-'); r.dob = d + '/' + mo + '/' + y; }
        if (!r.name) continue;
        // Profile and address on the first row of a family carry down to the rows below.
        if (r.profile) last = r; else if (last && last !== 'EXAMPLE') { r.profile = last.profile; ['mobile', 'email', 'address', 'city', 'district', 'state', 'pincode', 'country'].forEach(k => { if (!r[k]) r[k] = last[k] || ''; }); }
        else r.profile = r.name;
        out.push(r);
      }
      return out;
    }
  }
  throw new Error('No "Devotee Name" column found. Use the TTD Devotees template.');
}
function importCustomers() {
  if (typeof XLSX === 'undefined') return toast('Excel library did not load. Check internet and refresh.', 'err');
  const m = modal({ title: '📥 Import devotees from Excel', body: `
    <p class="muted" style="margin-top:0">Use the same <b>TTD-Devotees-Template.xlsx</b> as the Chrome extension. One row per devotee; profile name &amp; address on the first row of each family. A devotee with the same family, name and date of birth is updated, not duplicated.</p>
    <label class="btn primary"><input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden> Choose Excel file…</label>
    <div id="impPrev" style="margin-top:14px"></div>`, foot: '<button class="btn" data-x2>Cancel</button><button class="btn primary" data-ok disabled>Import</button>' });

      $('#impPrev', m.el).innerHTML = `<div class="alert ok">${rows.length} devotee(s) in ${fams} famil${fams === 1 ? 'y' : 'ies'} found in <b>${esc(file.name)}</b></div>
        <div class="tableWrap" style="max-height:300px"><table class="t"><thead><tr><th>Family</th><th>Name</th><th>DOB</th><th>Gender</th><th>ID</th><th>Mobile</th><th>City</th></tr></thead><tbody>
        ${rows.slice(0, 100).map(r => `<tr><td>${esc(r.profile)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.dob)}</td><td>${esc(r.gender)}</td><td>${esc(r.idType)} ${maskId(r.idNumber)}</td><td>${esc(r.mobile)}</td><td>${esc(r.city)}</td></tr>`).join('')}</tbody></table></div>`;

  m.el.querySelector('[data-ok]').onclick = async () => {

  };
}
function downloadXlsx(aoa, sheetName, file, widths) {
  if (typeof XLSX === 'undefined') return toast('Excel library did not load', 'err');
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, file);
}
function exportExt() {
  const pend = new Set();

  });

// ================================================================ receipt (print / Save as PDF in the browser: Telugu renders correctly)
function inWords(n) {
  n = Math.round(Math.abs(num(n)));
  if (!n) return 'Zero';
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const parts = [[10000000, 'Crore'], [100000, 'Lakh'], [1000, 'Thousand']];
  let out = [];
  parts.forEach(([v, w]) => { if (n >= v) { out.push((v === 10000000 ? inWords(Math.floor(n / v)) : two(Math.floor(n / v))) + ' ' + w); n %= v; } });
  if (n) out.push(three(n));
  return out.join(' ');
}

const RCPT_SIZES = { A4: '@page{size:A4;margin:14mm}', A5: '@page{size:A5;margin:8mm}', '80mm': '@page{size:80mm auto;margin:3mm}' };
function receiptModal(id) {
  const b = S.db.bookings.find(x => x.bookingId === id);
  if (!b) return toast('Booking not found', 'err');
  let size = RCPT_SIZES[S.db.settings.receiptSize] ? S.db.settings.receiptSize : 'A5';
  const m = modal({ title: '🧾 Receipt · ' + esc(id), noFocus: true,
    body: `<div class="row wrap" style="margin-bottom:12px"><span class="small muted">Paper</span><div class="seg" id="rSize">${Object.keys(RCPT_SIZES).map(k => `<button data-s="${k}" class="${k === size ? 'on' : ''}">${k === '80mm' ? '80mm thermal' : k}</button>`).join('')}</div></div>
      <div class="rcptWrap" id="rcptBox" data-size="${size}">${receiptHtml(b)}</div>
      <p class="small muted" style="margin-bottom:0">In the print window choose your printer, or <b>Save as PDF</b> to send the receipt on WhatsApp. On a phone: Share › Print › Save as PDF.</p>`,
    foot: '<button class="btn" data-x2>Close</button><button class="btn primary" data-ok>🖨 Print / Save as PDF</button>' });
  m.el.querySelector('[data-x2]').onclick = m.close;
  $('#rSize', m.el).addEventListener('click', e => { const t = e.target.closest('[data-s]'); if (!t) return; size = t.dataset.s; $$('#rSize button', m.el).forEach(x => x.classList.toggle('on', x === t)); $('#rcptBox', m.el).dataset.size = size; });
  m.el.querySelector('[data-ok]').onclick = () => {
    const area = document.createElement('div'); area.id = 'printArea'; area.dataset.size = size; area.innerHTML = receiptHtml(b);
    const pg = document.createElement('style'); pg.id = 'printPage'; pg.textContent = RCPT_SIZES[size];
    document.body.appendChild(area); document.head.appendChild(pg); document.body.classList.add('printing');
    const done = () => { area.remove(); pg.remove(); document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 500); }, 50);
    call('receiptPrinted', { bookingId: id, size }).then(() => pushActivity(id, 'Receipt printed', size)).catch(() => {});
  };
}

// ================================================================ global search
function globalSearch(q) {
  const box = $('#gres');
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.classList.add('hide'); return; }
  const qd = q.replace(/\s/g, '');
  const bk = S.db.bookings.filter(b => [b.bookingId, b.customerName, b.mobile, b.ttdRef, b.devotees].some(v => String(v || '').toLowerCase().includes(q))).slice(0, 8);
  const cu = S.db.customers.filter(c => [c.name, c.mobile, c.profile].some(v => String(v || '').toLowerCase().includes(q)) || String(c.idNumber || '').replace(/\s/g, '').toLowerCase().includes(qd)).slice(0, 6);
  box.innerHTML = (bk.length ? '<div class="it muted small" style="cursor:default">Bookings</div>' : '') + bk.map(b => `<div class="it" data-act="openBooking" data-id="${esc(b.bookingId)}"><b>${esc(b.customerName)}</b> ${badge(b.status)}<div class="muted small">${esc(b.bookingId)} · ${esc(b.service)} · ${fD(b.serviceDate || b.preferredDate)}</div></div>`).join('')
    + (cu.length ? '<div class="it muted small" style="cursor:default">Devotees</div>' : '') + cu.map(c => `<div class="it" data-act="openCustomer" data-id="${esc(c.customerId)}"><b>${esc(c.name)}</b><div class="muted small">${esc(c.profile)} · ${esc(c.mobile)}</div></div>`).join('')
    || '<div class="it muted">No results</div>';
  box.classList.remove('hide');
}

  importCustomers: () => importCustomers(),
  exportExt: () => exportExt(),
  downloadTemplate: () => downloadXlsx([TPL_HEAD, ['Example Family', 'Example Name', '14/05/1990', 'Male', 'Aadhaar Card', '1234 5678 9012', '', '9999999999', 'name@gmail.com', '1-2-3, Main Road', 'Srikakulam', 'Srikakulam', 'Andhra Pradesh', '532001', 'India']], 'Devotees', 'TTD-Devotees-Template.xlsx', [16, 26, 14, 10, 14, 18, 14, 12, 24, 26, 14, 14, 16, 9, 9]),
  editService: el => editService(el.dataset.id),
  editRelease: el => editRelease(el.dataset.id),
  relMonth: el => { const [y, m] = S.relMonth.split('-').map(Number); S.relMonth = ym(new Date(y, m - 1 + Number(el.dataset.d), 1)); render(); },
  addPattern: async () => { try { S.db.releases = await call('addReleases', { month: S.relMonth }); render(); toast('Usual release dates added — check them against the TTD announcement', 'ok'); } catch (e) { fail(e); } },
  editLogin: (el, e) => { if (e.target.closest('[data-act="loginBookings"]')) return; editLogin(el.dataset.id); },
  loginBookings: (el, e) => { e.preventDefault(); e.stopPropagation(); S.bf = { q: '', status: '', cat: '', month: '', login: el.dataset.id, when: 'request' }; go('bookings'); },
  msgKey: el => { S.msgKey = el.dataset.k; render(); },
  tplLang: el => { S.lang = el.dataset.l; render(); },
  insPh: el => { const ta = $('#tplText'); const p = '{' + el.dataset.p + '}'; const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + p + ta.value.slice(ta.selectionEnd); ta.focus(); ta.selectionStart = ta.selectionEnd = s + p.length; ta.dispatchEvent(new Event('input')); },
  saveTpl: async () => { const t = S.db.messages.find(m => m.key === S.msgKey); const patch = { key: t.key }; patch[tplField()] = $('#tplText').value; try { await call('saveMessage', patch); Object.assign(t, patch); toast('Template saved', 'ok'); } catch (e) { fail(e); } },
  saveSettings: async () => { try { S.db.settings = await call('saveSettings', formData($('#fSet'))); toast('Settings saved', 'ok'); render(); } catch (e) { fail(e); } },
  newKey: async () => { if (S.db.settings.apiKey && !await confirmBox('Make a new API key? The extension will need the new key.', 'Make new key')) return; try { S.db.settings.apiKey = await call('newApiKey', {}); render(); toast('API key ready — paste it in the extension', 'ok'); } catch (e) { fail(e); } },
  editUser: el => editUser(el.dataset.n),
  changePin: async () => { try { await call('changePin', formData($('#fPin'))); S.db.defaultPin = false; toast('PIN changed', 'ok'); render(); } catch (e) { fail(e); } },
  reloadActivity: async () => { try { S.db.activity = await call('activity', { limit: 500 }); render(); } catch (e) { fail(e); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});

// Live countdowns
setInterval(() => {
  const now = Date.now();
  $$('.cd[data-t]').forEach(el => {
    let s = Math.floor((Number(el.dataset.t) - now) / 1000);
    if (s <= 0) { el.textContent = s > -3600 ? '🔴 OPEN NOW' : 'Done'; return; }
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    el.textContent = (d ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
  });
}, 1000);

// ================================================================ start
if (S.token) boot(); else renderLogin();
})();
</script>

</body>
