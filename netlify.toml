# Netlify settings for the AGS Services Master CRM (Next.js app inside this repo).
[build]
  base = "04_Platform-Nextjs-Supabase/crm/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Run the app with Netlify's Next.js runtime (server pages, login, middleware).
[[plugins]]
  package = "@netlify/plugin-nextjs"
